<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PET 打藥劑量計算器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .calculator-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px 8px;
            text-align: center;
            font-size: 15px;
        }
        th {
            background-color: #f8f9fa;
            color: #333;
        }
        th.red-text {
            color: #e74c3c;
        }
        td input {
            width: 90%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-size: 16px;
        }
        td span {
            font-weight: bold;
            color: #2980b9;
        }
        td.red-val {
            color: #e74c3c;
            font-weight: bold;
        }
        .btn-container {
            text-align: center;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <h2>PET 打藥劑量計算器</h2>
    <table>
        <thead>
            <tr>
                <th>體重 (kg)</th>
                <th>預打藥量 <br><small style="font-weight:normal; font-size:12px;">(體重 * 0.14)</small></th>
                <th>打藥前</th>
                <th>打藥後</th>
                <th>實打藥量 <br><small style="font-weight:normal; font-size:12px;">(打藥前 - 打藥後)</small></th>
                <th class="red-text">-10%</th>
                <th class="red-text">20%</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" id="weight" placeholder="輸入體重" oninput="calculate()"></td>
                <td><span id="predose">-</span></td>
                <td><input type="number" id="beforeDose" placeholder="打藥前" oninput="calculate()"></td>
                <td><input type="number" id="afterDose" placeholder="打藥後" oninput="calculate()"></td>
                <td><span id="actualDose">-</span></td>
                <td class="red-val" id="minus10">-</td>
                <td class="red-val" id="plus20">-</td>
            </tr>
        </tbody>
    </table>
    
    <div class="btn-container">
        <button onclick="clearAll()">清除重置</button>
    </div>
</div>

<script>
    function calculate() {
        // 取得輸入值
        const weight = parseFloat(document.getElementById('weight').value);
        const beforeDose = parseFloat(document.getElementById('beforeDose').value);
        const afterDose = parseFloat(document.getElementById('afterDose').value);

        // 1. 計算預打藥量 (體重 * 0.14)
        const predoseElem = document.getElementById('predose');
        if (!isNaN(weight)) {
            const predose = weight * 0.14;
            predoseElem.innerText = predose.toFixed(2);
        } else {
            predoseElem.innerText = '-';
        }

        // 2. 計算實打藥量 (打藥前 - 打藥後)
        const actualDoseElem = document.getElementById('actualDose');
        const minus10Elem = document.getElementById('minus10');
        const plus20Elem = document.getElementById('plus20');

        if (!isNaN(beforeDose) && !isNaN(afterDose)) {
            const actualDose = beforeDose - afterDose;
            actualDoseElem.innerText = actualDose.toFixed(2);

            // 計算 -10% 與 20%
            const m10 = actualDose * 0.9;  // 實打藥量扣掉 10%
            const p20 = actualDose * 1.2;  // 實打藥量增加 20% (或根據您需求調整，若是指總量可自行微調公式)
            
            minus10Elem.innerText = m10.toFixed(2);
            plus20Elem.innerText = p20.toFixed(2);
        } else {
            actualDoseElem.innerText = '-';
            minus10Elem.innerText = '-';
            plus20Elem.innerText = '-';
        }
    }

    function clearAll() {
        document.getElementById('weight').value = '';
        document.getElementById('beforeDose').value = '';
        document.getElementById('afterDose').value = '';
        document.getElementById('predose').innerText = '-';
        document.getElementById('actualDose').innerText = '-';
        document.getElementById('minus10').innerText = '-';
        document.getElementById('plus20').innerText = '-';
    }
</script>

</body>
</html>
