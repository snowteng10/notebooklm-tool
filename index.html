<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PET 打藥劑量計算器</title>
    <!-- 引入 SheetJS (xlsx) 庫以支援直接匯出 Excel 檔案 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 1100px;
        }
        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 30px;
            font-size: 32px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            table-layout: fixed;
        }
        th, td {
            border: 2px solid #cbd5e0;
            padding: 20px 10px;
            text-align: center;
            font-size: 20px;
            word-wrap: break-word;
        }
        
        /* 欄寬比例分配 */
        th:nth-child(1), td:nth-child(1) { width: 14%; }
        th:nth-child(2), td:nth-child(2) { width: 16%; }
        th:nth-child(3), td:nth-child(3) { width: 14%; }
        th:nth-child(4), td:nth-child(4) { width: 14%; }
        th:nth-child(5), td:nth-child(5) { width: 16%; }
        th:nth-child(6), td:nth-child(6) { width: 13%; }
        th:nth-child(7), td:nth-child(7) { width: 13%; }

        /* 上層標題格子顏色設定 */
        th.th-blue {
            background-color: #bee3f8 !important; /* 體重欄：藍色 */
            color: #1a365d;
        }
        th.th-orange {
            background-color: #feebc8 !important; /* 預打藥量：橘色 */
            color: #7b341e;
        }
        th.th-yellow {
            background-color: #fefcbf !important; /* 打藥前、打藥後：黃色 */
            color: #744210;
        }
        th.th-green {
            background-color: #c6f6d5 !important; /* 實打藥量：綠色 */
            color: #22543d;
        }
        th.th-range {
            background-color: #fed7d7 !important; /* 範圍欄：柔和紅 */
            color: #9b2c2c;
        }

        td input {
            width: 92%;
            padding: 12px 6px;
            box-sizing: border-box;
            border: 2px solid #a0aec0;
            border-radius: 8px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #2d3748;
            background-color: #ffffff;
        }
        td input:focus {
            border-color: #3182ce;
            outline: none;
            box-shadow: 0 0 8px rgba(49, 130, 206, 0.4);
        }
        td span {
            font-weight: bold;
            font-size: 24px;
            color: #1a202c;
        }
        td.range-val {
            font-weight: bold;
            font-size: 22px;
            color: #2b6cb0;
            background-color: #fff5f5;
        }
        .alert-box {
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            display: none;
        }

            background-color: #fff5f5;
            border: 3px solid #fc8181;
            color: #c5
