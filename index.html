<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PET 打藥劑量計算器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 900px;
        }
        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 30px;
            font-size: 28px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        th, td {
            border: 2px solid #e2e8f0;
            padding: 16px 12px;
            text-align: center;
            font-size: 18px;
        }
        th {
            background-color: #f7fafc;
            color: #2d3748;
            font-weight: 600;
        }
        th.red-text {
            color: #e53e3e;
        }
        td input {
            width: 90%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2b6cb0;
        }
        td input:focus {
            border-color: #3182ce;
            outline: none;
            box-shadow: 0 0 5px rgba(49, 130, 206, 0.3);
        }
        td span {
            font-weight: bold;
            font-size: 20px;
            color: #2b6cb0;
        }
        td.red-val {
            color: #e53e3e;
            font-weight: bold;
            font-size: 20px;
        }
        .alert-box {
            background-color: #fff5f5;
            border: 2px solid #feb2b2;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            display: none;
        }
        .btn-container {
            text-align: center;
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        button:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <h2>PET 打藥劑量計算器</h2>
    
    <div id="alertBox" class="alert-box">⚠️ 注意：實打藥量已超出上限範圍 (+20%)！</div>

    <table>
        <thead>
            <tr>
                <th>體重 (kg)</th>
                <th>預打藥量 <br><small style="font-weight:normal; font-size:14px; color:#4a5568;">(體重 × 0.14)</small>[cite: 1]</th>
                <th>打藥前</th>
                <th>打藥後</th>
                <th>實打藥量 <br><small style="font-weight:normal; font-size:14px; color:#4a5568;">(打藥前 − 打藥後)</small></th>
                <th class="red-text">-10% 範圍</th>
                <th class="red-text">+20% 範圍</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" id="weight" placeholder="輸入體重" oninput="calculate()"></td>
                <td><span id="predose">-</span></td>
                <td><input type="number" id="beforeDose" placeholder="打藥前" oninput="calculate()"></td>
                <td><input type="number" id="afterDose" placeholder="打藥後" oninput="calculate()"></td>
                <td><span id="actualDose">-</span></td>
                <td class="red-val" id="minus10">-</td>
                <td class="red-val" id="plus20">-</td>
            </tr>
        </tbody>
    </table>
    
    <div class="btn-container">
        <button onclick="clearAll()">清除重置</button>
    </div>
</div>

<script>
    // 播放提示音效功能 (Web Audio API)
    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // 頻率
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.4); // 嗶 0.4 秒
        } catch (e) {
            console.log("音效播放失敗", e);
        }
    }

    let hasAlerted = function() {}; // 防止過度重複播放警報

    function calculate() {
        const weight = parseFloat(document.getElementById('weight').value);
        const beforeDose = parseFloat(document.getElementById('beforeDose').value);
        const afterDose = parseFloat(document.getElementById('afterDose').value);

        const predoseElem = document.getElementById('predose');
        const actualDoseElem = document.getElementById('actualDose');
        const minus10Elem = document.getElementById('minus10');
        const plus20Elem = document.getElementById('plus20');
        const alertBox = document.getElementById('alertBox');

        let predose = NaN;
        let actualDose = NaN;

        // 1. 計算預打藥量 (體重 * 0.14)
        if (!isNaN(weight)) {
            predose = weight * 0.14;
            predoseElem.innerText = predose.toFixed(2);
        } else {
            predoseElem.innerText = '-';
        }

        // 2. 計算實打藥量與比例範圍
        if (!isNaN(beforeDose) && !isNaN(afterDose)) {
            actualDose = beforeDose - afterDose;
            actualDoseElem.innerText = actualDose.toFixed(2);
        } else {
            actualDoseElem.innerText = '-';
        }

        // 如果有預打藥量，計算基於預打藥量的 -10% 與 +20%
        if (!isNaN(predose)) {
            const m10 = predose * 0.9;
            const p20 = predose * 1.2;
            
            minus10Elem.innerText = m10.toFixed(2);
            plus20Elem.innerText = p20.toFixed(2);

            // 檢查實打藥量是否超過 +20% 範圍
            if (!isNaN(actualDose) && actualDose > p20) {
                alertBox.style.display = 'block';
                playBeep(); // 觸發聲音提示
            } else {
                alertBox.style.display = 'none';
            }
        } else {
            minus10Elem.innerText = '-';
            plus20Elem.innerText = '-';
            alertBox.style.display = 'none';
        }
    }

    function clearAll() {
        document.getElementById('weight').value = '';
        document.getElementById('beforeDose').value = '';
        document.getElementById('afterDose').value = '';
        document.getElementById('predose').innerText = '-';
        document.getElementById('actualDose').innerText = '-';
        document.getElementById('minus10').innerText = '-';
        document.getElementById('plus20').innerText = '-';
        document.getElementById('alertBox').style.display = 'none';
    }
</script>

</body>
</html>
