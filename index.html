<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PET 打藥劑量計算器</title>
    <!-- 引入 SheetJS (xlsx) 庫以支援直接匯出 Excel 檔案 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 1100px;
        }
        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .record-counter {
            text-align: center;
            color: #4a5568;
            font-size: 18px;
            margin-bottom: 25px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            table-layout: fixed;
        }
        th, td {
            border: 2px solid #cbd5e0;
            padding: 20px 10px;
            text-align: center;
            font-size: 20px;
            word-wrap: break-word;
        }
        
        /* 欄寬比例分配 */
        th:nth-child(1), td:nth-child(1) { width: 14%; }
        th:nth-child(2), td:nth-child(2) { width: 16%; }
        th:nth-child(3), td:nth-child(3) { width: 14%; }
        th:nth-child(4), td:nth-child(4) { width: 14%; }
        th:nth-child(5), td:nth-child(5) { width: 16%; }
        th:nth-child(6), td:nth-child(6) { width: 13%; }
        th:nth-child(7), td:nth-child(7) { width: 13%; }

        /* 上層標題格子顏色設定 */
        th.th-blue {
            background-color: #bee3f8 !important; /* 體重欄：藍色 */
            color: #1a365d;
        }
        th.th-orange {
            background-color: #feebc8 !important; /* 預打藥量：橘色 */
            color: #7b341e;
        }
        th.th-yellow {
            background-color: #fefcbf !important; /* 打藥前、打藥後：黃色 */
            color: #744210;
        }
        th.th-green {
            background-color: #c6f6d5 !important; /* 實打藥量：綠色 */
            color: #22543d;
        }
        th.th-range {
            background-color: #fed7d7 !important; /* 範圍欄：柔和紅 */
            color: #9b2c2c;
        }

        td input {
            width: 92%;
            padding: 12px 6px;
            box-sizing: border-box;
            border: 2px solid #a0aec0;
            border-radius: 8px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #2d3748;
            background-color: #ffffff;
        }
        td input:focus {
            border-color: #3182ce;
            outline: none;
            box-shadow: 0 0 8px rgba(49, 130, 206, 0.4);
        }
        td span {
            font-weight: bold;
            font-size: 24px;
            color: #1a202c;
        }
        td.range-val {
            font-weight: bold;
            font-size: 22px;
            color: #2b6cb0;
            background-color: #fff5f5;
        }
        .alert-box {
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            display: none;
        }
        .alert-too-much {
            background-color: #fff5f5;
            border: 3px solid #fc8181;
            color: #c53030;
        }
        .alert-too-less {
            background-color: #fffaf0;
            border: 3px solid #f6ad55;
            color: #dd6b20;
        }
        .btn-container {
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        button.btn-success {
            background-color: #38a169;
        }
        button.btn-success:hover {
            background-color: #2f855a;
        }
        button.btn-secondary {
            background-color: #718096;
        }
        button.btn-secondary:hover {
            background-color: #4a5568;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <h2>PET 打藥劑量計算器</h2>
    <div class="record-counter" id="recordCounter">目前累積記錄筆數：0 筆</div>
    
    <div id="alertBox" class="alert-box"></div>

    <table>
        <thead>
            <tr>
                <th class="th-blue">體重 (kg)</th>
                <th class="th-orange">預打藥量 <br><small style="font-size:15px; font-weight:normal;">(體重 × 0.14)</small></th>
                <th class="th-yellow">打藥前</th>
                <th class="th-yellow">打藥後</th>
                <th class="th-green">實打藥量 <br><small style="font-size:15px; font-weight:normal;">(打藥前 − 打藥後)</small></th>
                <th class="th-range">-10% 範圍</th>
                <th class="th-range">+20% 範圍</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <input type="number" id="weight" placeholder="輸入體重" oninput="calculate()">
                </td>
                <td>
                    <span id="predose">-</span>
                </td>
                <td>
                    <input type="number" id="beforeDose" placeholder="打藥前" oninput="calculate()">
                </td>
                <td>
                    <input type="number" id="afterDose" placeholder="打藥後" oninput="calculate()">
                </td>
                <td>
                    <span id="actualDose">-</span>
                </td>
                <td class="range-val" id="minus10">-</td>
                <td class="range-val" id="plus20">-</td>
            </tr>
        </tbody>
    </table>
    
    <div class="btn-container">
        <button class="btn-success" onclick="exportToExcel()">📥 下載完整多筆 Excel 總表</button>
        <button class="btn-secondary" onclick="clearAll()">清除重置（換下一位）</button>
    </div>
</div>

<script>
    let multiRecords = [];
    let currentRecordId = null;

    // 警報聲音提示 (使用 Web Audio API，無需外接音檔)
    function playBeep(isTooMuch) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audioCtx = new AudioContext();

            // 若音效被瀏覽器暫停，嘗試解鎖
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            if (isTooMuch) {
                // 太多：高頻急促音
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.12);
            } else {
                // 太少：低頻沉穩音
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(330, audioCtx.currentTime + 0.12);
            }
            
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.35);
        } catch (e) {
            console.log("音效播放失敗", e);
        }
    }

    function calculate() {
        const weight = parseFloat(document.getElementById('weight').value);
        const beforeDose = parseFloat(document.getElementById('beforeDose').value);
        const afterDose = parseFloat(document.getElementById('afterDose').value);

        const predoseElem = document.getElementById('predose');
        const actualDoseElem = document.getElementById('actualDose');
        const minus10Elem = document.getElementById('minus10');
        const plus20Elem = document.getElementById('plus20');
        const alertBox = document.getElementById('alertBox');

        let predose = NaN;
        let actualDose = NaN;

        if (!isNaN(weight)) {
            predose = weight * 0.14;
            predoseElem.innerText = predose.toFixed(2);
        } else {
            predoseElem.innerText = '-';
        }

        if (!isNaN(beforeDose) && !isNaN(afterDose)) {
            actualDose = beforeDose - afterDose;
            actualDoseElem.innerText = actualDose.toFixed(2);
        } else {
            actualDoseElem.innerText = '-';
        }

        if (!isNaN(predose)) {
            const m10 = predose * 0.9;
            const p20 = predose * 1.2;
            
            minus10Elem.innerText = m10.toFixed(2);
            plus20Elem.innerText = p20.toFixed(2);

            // 自動累積至背景紀錄
            if (!isNaN(weight) && !isNaN(beforeDose) && !isNaN(afterDose) && !isNaN(actualDose)) {
                const now = new Date().toLocaleString('zh-TW');
                const recordData = {
                    "記錄時間": now,
                    "體重 (kg)": weight,
                    "預打藥量": predose.toFixed(2),
                    "打藥前": beforeDose,
                    "打藥後": afterDose,
                    "實打藥量": actualDose.toFixed(2),
                    "-10% 範圍": m10.toFixed(2),
                    "+20% 範圍": p20.toFixed(2)
                };

                if (currentRecordId === null) {
                    multiRecords.push(recordData);
                    currentRecordId = multiRecords.length - 1;
                } else {
                    multiRecords[currentRecordId] = recordData;
                }

                document.getElementById('recordCounter').innerText = `目前累積記錄筆數：${multiRecords.length} 筆`;
            }

            if (!isNaN(actualDose)) {
                if (actualDose > p20) {
                    alertBox.className = 'alert-box alert-too-much';
                    alertBox.innerText = '⚠️ 警告：實打藥量【太多】，已超出 +20% 上限範圍！';
                    alertBox.style.display = 'block';
                    playBeep(true);  // 播放太多警示音
                } else if (actualDose < m10) {
                    alertBox.className = 'alert-box alert-too-less';
                    alertBox.innerText = '⚠️ 注意：實打藥量【太少】，低於 -10% 下限範圍！';
                    alertBox.style.display = 'block';
                    playBeep(false); // 播放太少警示音
                } else {
                    alertBox.style.display = 'none';
                }
            } else {
                alertBox.style.display = 'none';
            }
        } else {
            minus10Elem.innerText = '-';
            plus20Elem.innerText = '-';
            alertBox.style.display = 'none';
        }
    }

    function exportToExcel() {
        if (multiRecords.length === 0) {
            alert('目前尚無累積的計算紀錄可供下載！');
            return;
        }

        const worksheet = XLSX.utils.json_to_sheet(multiRecords);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "PET打藥總表");

        const now = new Date();
        const fileName = `PET_Dose_Summary_${now.toISOString().slice(0,10)}.xlsx`;
        XLSX.writeFile(workbook, fileName);
    }

    function clearAll() {
        document.getElementById('weight').value = '';
        document.getElementById('beforeDose').value = '';
        document.getElementById('afterDose').value = '';
        document.getElementById('predose').innerText = '-';
        document.getElementById('actualDose').innerText = '-';
        document.getElementById('minus10').innerText = '-';
        document.getElementById('plus20').innerText = '-';
        document.getElementById('alertBox').style.display = 'none';
        
        currentRecordId = null;
    }
</script>

</body>
</html>
